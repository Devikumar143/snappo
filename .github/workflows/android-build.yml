name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Install JS dependencies ───────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Set up JDK 17 (required for Android Gradle builds) ────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Set up Android SDK ────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Grant Gradle wrapper execute permission ───────────────────────
      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      # ── 8. Cache Gradle dependencies to speed up future builds ───────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 9. Build the debug APK ───────────────────────────────────────────
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            -x lint \
            -x test \
            --build-cache
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 10. Upload APK as downloadable artifact ──────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snappo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── 11. Print APK info ───────────────────────────────────────────────
      - name: Print APK details
        run: |
          echo "✅ Build successful!"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
